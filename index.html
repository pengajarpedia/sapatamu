<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SapaTamu – Latihan Melayani Tamu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>SapaTamu</h1>
      <p>Latihan bahasa Inggris untuk profesi pariwisata di Bali</p>
    </header>

    <!-- Bagian 1: pilih bidang → profesi → kasus -->
    <section id="pilih">
      <div class="kepala-pilih">
        <button id="tombol-kembali" type="button" class="tombol-kecil" hidden>← Kembali</button>
        <h2 id="judul-pilih">Pilih bidang</h2>
      </div>
      <div id="daftar-pilihan" class="daftar-pilihan"></div>
    </section>

    <!-- Bagian 2: percakapan (tersembunyi sampai kasus dipilih) -->
    <section id="percakapan" hidden>
      <h2 id="judul-skenario"></h2>
      <div id="kartu-tugas" class="kartu-tugas"></div>
      <div id="chat"></div>
      <p class="privasi">Suaramu diubah menjadi teks oleh browser. Rekaman suara tidak disimpan. Jangan menyebut data pribadi asli.</p>
      <button id="tombol-rekam">🎤 Tekan untuk bicara</button>
      <form id="form-ketik">
        <input id="input-ketik" placeholder="Atau ketik jawabanmu di sini..." autocomplete="off">
        <button type="submit">Kirim</button>
      </form>
      <button id="tombol-akhiri" type="button" class="tombol-sekunder">Akhiri & lihat nilai</button>
      <p id="status"></p>
    </section>

    <!-- Bagian 3: laporan nilai -->
    <section id="laporan" hidden></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
